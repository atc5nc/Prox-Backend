name: Store Location Matcher Tests

on:
  pull_request:
    paths:
      - "services/store_location_matcher.py"
      - "jobs/backfill_store_ids.py"
      - "jobs/store_location_worker.py"
      - "tests/test_store_location_matcher.py"
      - "tests/test_store_location_worker.py"
      - ".github/workflows/store-location-matcher-tests.yml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run store location matcher tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_store_location_matcher.py tests/test_store_location_worker.py
